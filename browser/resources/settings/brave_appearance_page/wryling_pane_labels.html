<style include="cr-shared-style settings-shared">
  :host { display: block; }
  .labels-section { padding: var(--wry-space-4); }
  h3 { font: var(--wry-headline); margin: 0 0 var(--wry-space-1); }
  .description { color: var(--wry-text-secondary); font: var(--wry-callout); margin: 0 0 var(--wry-space-4); }
  .picker { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--wry-space-3); }
  .option {
    display: block; padding: var(--wry-space-2); margin: 0; text-align: start;
    font: inherit; color: inherit; cursor: pointer;
    /* Over the shared Wryling button style, like the segmented controls. */
    background: transparent !important; box-shadow: none !important;
    border: 2px solid transparent !important; border-radius: var(--wry-radius-l) !important;
    min-height: 0 !important; height: auto !important;
  }
  .option:hover { background: var(--wry-hover) !important; }
  .option[aria-checked="true"] { border-color: var(--wry-accent) !important; }
  .option:focus-visible { outline: 2px solid var(--wry-focus); outline-offset: 2px; }
  .option svg { display: block; width: 100%; height: auto; }
  .name { display: block; margin-top: var(--wry-space-2); font: var(--wry-body); }
  .hint { display: block; color: var(--wry-text-secondary); font: var(--wry-callout); }
  .frame { fill: color-mix(in srgb, var(--wry-accent) 30%, var(--wry-canvas)); }
  .side { fill: color-mix(in srgb, var(--wry-accent) 40%, var(--wry-canvas)); }
  .row { fill: color-mix(in srgb, var(--wry-accent) 60%, var(--wry-canvas)); }
  .pane { fill: var(--wry-raised); }
  .pane.active { stroke: var(--wry-accent); stroke-width: 1.2; }
  .line { fill: var(--wry-stroke); }
  .chip { fill: var(--wry-raised); stroke: var(--wry-stroke); stroke-width: 0.5; }
  .site { fill: var(--wry-text); font: 500 6.5px system-ui, sans-serif; }
  .chip-site { fill: var(--wry-text); font: 500 5.2px system-ui, sans-serif; }
  .fav-a { fill: #d68c59; }
  .fav-b { fill: #459d96; }
</style>
